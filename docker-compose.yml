# Nama project: container/volume tidak bentrok dengan arteloka-* di server yang sama
name: docsearch

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Hemat RAM di VPS ~4GB (shared dengan arteloka + whatsapp)
    mem_limit: ${POSTGRES_MEM_LIMIT:-512m}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: paperless
    # Hanya localhost host (arteloka sudah pakai 5432 publik)
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: ${REDIS_MEM_LIMIT:-128m}
    command:
      [
        "redis-server",
        "--maxmemory",
        "96mb",
        "--maxmemory-policy",
        "allkeys-lru",
        "--save",
        "",
      ]
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    restart: unless-stopped
    # OCR paling boros; batasi agar tidak OOM di VPS 4GB
    mem_limit: ${PAPERLESS_MEM_LIMIT:-1536m}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - paperless_data:/usr/src/paperless/data
      - paperless_media:/usr/src/paperless/media
      - ./paperless/consume:/usr/src/paperless/consume
      - ./paperless/export:/usr/src/paperless/export
    environment:
      PAPERLESS_REDIS: redis://redis:6379
      PAPERLESS_DBHOST: postgres
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBUSER: ${POSTGRES_USER}
      PAPERLESS_DBPASS: ${POSTGRES_PASSWORD}
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY:?Set PAPERLESS_SECRET_KEY in .env}
      PAPERLESS_TIME_ZONE: ${TZ:-Asia/Jakarta}
      PAPERLESS_OCR_LANGUAGE: eng+ind
      PAPERLESS_OCR_LANGUAGES: ind
      PAPERLESS_OCR_MODE: auto
      PAPERLESS_CONSUMER_POLLING: 60
      PAPERLESS_CONSUMER_RECURSIVE: "true"
      PAPERLESS_CONSUMER_SUBDIRS_AS_TAGS: "true"
      # Worker ringan untuk VPS kecil
      PAPERLESS_TASK_WORKERS: ${PAPERLESS_TASK_WORKERS:-1}
      PAPERLESS_THREADS_PER_WORKER: ${PAPERLESS_THREADS_PER_WORKER:-1}
      PAPERLESS_WEBSERVER_WORKERS: ${PAPERLESS_WEBSERVER_WORKERS:-1}
      PAPERLESS_CONVERT_MEMORY_LIMIT: ${PAPERLESS_CONVERT_MEMORY_LIMIT:-256}
      PAPERLESS_URL: ${PAPERLESS_URL:-http://127.0.0.1:8000}
      PAPERLESS_ADMIN_USER: ${PAPERLESS_ADMIN_USER:?Set PAPERLESS_ADMIN_USER}
      PAPERLESS_ADMIN_PASSWORD: ${PAPERLESS_ADMIN_PASSWORD:?Set PAPERLESS_ADMIN_PASSWORD}
      PAPERLESS_ADMIN_MAIL: ${PAPERLESS_ADMIN_MAIL:-admin@localhost}
    ports:
      - "127.0.0.1:${PAPERLESS_HOST_PORT:-8000}:8000"
    networks:
      - internal

  sync-worker:
    build:
      context: .
      dockerfile: sync-worker/Dockerfile
    restart: unless-stopped
    mem_limit: ${SYNC_WORKER_MEM_LIMIT:-512m}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      paperless:
        condition: service_started
    volumes:
      - ./paperless/consume:/consume
      - sync_temp:/tmp/sync
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/app
      REDIS_URL: redis://redis:6379
      PAPERLESS_URL: http://paperless:8000
      PAPERLESS_TOKEN: ${PAPERLESS_API_TOKEN:-}
      CONSUME_DIR: /consume
      SYNC_TEMP_DIR: /tmp/sync
      SYNC_POLL_INTERVAL_MS: ${SYNC_POLL_INTERVAL_MS:-900000}
      AUTO_SCAN_ENABLED: ${AUTO_SCAN_ENABLED:-false}
      SCAN_MAX_FILES: ${SCAN_MAX_FILES:-20}
      WEBDAV_DISCOVERY_CONCURRENCY: ${WEBDAV_DISCOVERY_CONCURRENCY:-6}
      WEBDAV_DOWNLOAD_CONCURRENCY: ${WEBDAV_DOWNLOAD_CONCURRENCY:-1}
      OCR_PENDING_TIMEOUT_MINUTES: ${OCR_PENDING_TIMEOUT_MINUTES:-180}
      STUCK_SYNC_MINUTES: ${STUCK_SYNC_MINUTES:-60}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env}
      TZ: ${TZ:-Asia/Jakarta}
    networks:
      - internal

  # Sertakan lewat COMPOSE_PROFILES=prod di .env (wajib di server).
  app:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: app/Dockerfile
    restart: unless-stopped
    mem_limit: ${APP_MEM_LIMIT:-512m}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      paperless:
        condition: service_started
      sync-worker:
        condition: service_started
    ports:
      # arteloka pakai 3001 → default DocSearch di 3002
      - "${APP_PORT:-3002}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/app
      REDIS_URL: redis://redis:6379
      PAPERLESS_URL: http://paperless:8000
      PAPERLESS_TOKEN: ${PAPERLESS_API_TOKEN:-}
      PAPERLESS_API_TOKEN: ${PAPERLESS_API_TOKEN:-}
      NEXTAUTH_URL: ${NEXTAUTH_URL:?Set NEXTAUTH_URL in .env}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
      BAPPENAS_URL: ${BAPPENAS_URL:-https://cloud.bappenas.go.id}
      BAPPENAS_USERNAME: ${BAPPENAS_USERNAME:-}
      BAPPENAS_PASSWORD: ${BAPPENAS_PASSWORD:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      SCAN_MAX_FILES: ${SCAN_MAX_FILES:-20}
      OCR_PENDING_TIMEOUT_MINUTES: ${OCR_PENDING_TIMEOUT_MINUTES:-180}
      AUTO_SCAN_ENABLED: ${AUTO_SCAN_ENABLED:-false}
      TZ: ${TZ:-Asia/Jakarta}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  paperless_data:
  paperless_media:
  sync_temp:
