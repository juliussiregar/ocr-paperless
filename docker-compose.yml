# Nama project: container/volume tidak bentrok dengan arteloka-* di server yang sama
name: docsearch

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # VPS 8GB RAM (shared dengan arteloka + whatsapp); override via .env
    mem_limit: ${POSTGRES_MEM_LIMIT:-1536m}
    # Paperless workers + Prisma app/worker share this instance (default PG is 100).
    command: postgres -c max_connections=${POSTGRES_MAX_CONNECTIONS:-200}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: paperless
    # Hanya localhost host (arteloka sudah pakai 5432 publik)
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: ${REDIS_MEM_LIMIT:-512m}
    command:
      [
        "redis-server",
        "--maxmemory",
        "${REDIS_MAXMEMORY:-512mb}",
        "--maxmemory-policy",
        "${REDIS_MAXMEMORY_POLICY:-noeviction}",
        "--save",
        "",
      ]
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    restart: unless-stopped
    # OCR boros RAM; default cap untuk VPS 8GB (shared host)
    mem_limit: ${PAPERLESS_MEM_LIMIT:-3584m}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - paperless_data:/usr/src/paperless/data
      - paperless_media:/usr/src/paperless/media
      - ./paperless/consume:/usr/src/paperless/consume
      - ./paperless/export:/usr/src/paperless/export
    environment:
      PAPERLESS_REDIS: redis://redis:6379
      PAPERLESS_DBHOST: postgres
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBUSER: ${POSTGRES_USER}
      PAPERLESS_DBPASS: ${POSTGRES_PASSWORD}
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY:?Set PAPERLESS_SECRET_KEY in .env}
      PAPERLESS_TIME_ZONE: ${TZ:-Asia/Jakarta}
      PAPERLESS_OCR_LANGUAGE: eng+ind
      PAPERLESS_OCR_LANGUAGES: ind
      PAPERLESS_OCR_MODE: auto
      PAPERLESS_CONSUMER_POLLING: ${PAPERLESS_CONSUMER_POLLING:-3}
      PAPERLESS_CONSUMER_RECURSIVE: "true"
      PAPERLESS_CONSUMER_SUBDIRS_AS_TAGS: "true"
      # Default untuk VPS 8GB (override di .env)
      PAPERLESS_TASK_WORKERS: ${PAPERLESS_TASK_WORKERS:-5}
      PAPERLESS_THREADS_PER_WORKER: ${PAPERLESS_THREADS_PER_WORKER:-2}
      PAPERLESS_WEBSERVER_WORKERS: ${PAPERLESS_WEBSERVER_WORKERS:-2}
      PAPERLESS_CONVERT_MEMORY_LIMIT: ${PAPERLESS_CONVERT_MEMORY_LIMIT:-1024}
      PAPERLESS_URL: ${PAPERLESS_URL:-http://127.0.0.1:8000}
      PAPERLESS_ADMIN_USER: ${PAPERLESS_ADMIN_USER:?Set PAPERLESS_ADMIN_USER}
      PAPERLESS_ADMIN_PASSWORD: ${PAPERLESS_ADMIN_PASSWORD:?Set PAPERLESS_ADMIN_PASSWORD}
      PAPERLESS_ADMIN_MAIL: ${PAPERLESS_ADMIN_MAIL:-admin@localhost}
    ports:
      - "127.0.0.1:${PAPERLESS_HOST_PORT:-8000}:8000"
    networks:
      - internal

  sync-worker:
    build:
      context: .
      dockerfile: sync-worker/Dockerfile
    restart: unless-stopped
    mem_limit: ${SYNC_WORKER_MEM_LIMIT:-1536m}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      paperless:
        condition: service_started
    volumes:
      - ./paperless/consume:/consume
      - sync_temp:/tmp/sync
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/app
      PRISMA_CONNECTION_LIMIT: ${PRISMA_CONNECTION_LIMIT_WORKER:-16}
      PRISMA_POOL_TIMEOUT: ${PRISMA_POOL_TIMEOUT:-30}
      FOLDER_SNAPSHOT_UPSERT_CONCURRENCY: ${FOLDER_SNAPSHOT_UPSERT_CONCURRENCY:-4}
      FOLDER_SNAPSHOT_BATCH_SIZE: ${FOLDER_SNAPSHOT_BATCH_SIZE:-40}
      DB_HOT_CLIENTS_THRESHOLD: ${DB_HOT_CLIENTS_THRESHOLD:-130}
      DB_HOT_MAX_WAIT_MS: ${DB_HOT_MAX_WAIT_MS:-120000}
      REDIS_URL: redis://redis:6379
      PAPERLESS_URL: http://paperless:8000
      PAPERLESS_TOKEN: ${PAPERLESS_API_TOKEN:-}
      CONSUME_DIR: /consume
      SYNC_TEMP_DIR: /tmp/sync
      SYNC_POLL_INTERVAL_MS: ${SYNC_POLL_INTERVAL_MS:-900000}
      SCAN_MAX_FILES: ${SCAN_MAX_FILES:-750}
      SCAN_DISCOVER_CONCURRENCY: ${SCAN_DISCOVER_CONCURRENCY:-12}
      SCAN_INGEST_CONCURRENCY: ${SCAN_INGEST_CONCURRENCY:-12}
      WEBDAV_DISCOVERY_CONCURRENCY: ${WEBDAV_DISCOVERY_CONCURRENCY:-24}
      WEBDAV_DOWNLOAD_CONCURRENCY: ${WEBDAV_DOWNLOAD_CONCURRENCY:-14}
      WEBDAV_TOTAL_CONCURRENCY: ${WEBDAV_TOTAL_CONCURRENCY:-28}
      FULL_WALK_INTERVAL_MS: ${FULL_WALK_INTERVAL_MS:-10800000}
      INGEST_MAX_RETRY_COUNT: ${INGEST_MAX_RETRY_COUNT:-5}
      SCAN_STUCK_JOB_MINUTES: ${SCAN_STUCK_JOB_MINUTES:-45}
      SYNC_WORKER_SHARD_COUNT: ${SYNC_WORKER_SHARD_COUNT:-1}
      SYNC_WORKER_SHARD_INDEX: ${SYNC_WORKER_SHARD_INDEX:-0}
      OCR_RECONCILE_INTERVAL_MS: ${OCR_RECONCILE_INTERVAL_MS:-5000}
      OCR_RECONCILE_BATCH: ${OCR_RECONCILE_BATCH:-300}
      EMBED_BACKFILL_BATCH: ${EMBED_BACKFILL_BATCH:-35}
      EMBED_PAUSE_DURING_INGEST: ${EMBED_PAUSE_DURING_INGEST:-true}
      EMBED_TX_TIMEOUT_MS: ${EMBED_TX_TIMEOUT_MS:-60000}
      OCR_PENDING_TIMEOUT_MINUTES: ${OCR_PENDING_TIMEOUT_MINUTES:-180}
      STUCK_SYNC_MINUTES: ${STUCK_SYNC_MINUTES:-60}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      ASK_CHUNK_SIZE: ${ASK_CHUNK_SIZE:-1500}
      ASK_CHUNK_OVERLAP: ${ASK_CHUNK_OVERLAP:-200}
      POST_SYNC_WARM_ENABLED: ${POST_SYNC_WARM_ENABLED:-true}
      POST_SYNC_WARM_MAX_DIRS: ${POST_SYNC_WARM_MAX_DIRS:-40}
      CLOUD_LISTING_CACHE_TTL_SEC: ${CLOUD_LISTING_CACHE_TTL_SEC:-600}
      TZ: ${TZ:-Asia/Jakarta}
    networks:
      - internal

  # Sertakan lewat COMPOSE_PROFILES=prod di .env (wajib di server).
  app:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: app/Dockerfile
    restart: unless-stopped
    mem_limit: ${APP_MEM_LIMIT:-1024m}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      paperless:
        condition: service_started
      sync-worker:
        condition: service_started
    ports:
      # arteloka pakai 3001 → default DocSearch di 3002
      - "${APP_PORT:-3002}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/app
      PRISMA_CONNECTION_LIMIT: ${PRISMA_CONNECTION_LIMIT_APP:-8}
      PRISMA_POOL_TIMEOUT: ${PRISMA_POOL_TIMEOUT:-30}
      REDIS_URL: redis://redis:6379
      PAPERLESS_URL: http://paperless:8000
      PAPERLESS_TOKEN: ${PAPERLESS_API_TOKEN:-}
      PAPERLESS_API_TOKEN: ${PAPERLESS_API_TOKEN:-}
      NEXTAUTH_URL: ${NEXTAUTH_URL:?Set NEXTAUTH_URL in .env}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET in .env}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      AUTH_URL: ${NEXTAUTH_URL}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
      BAPPENAS_URL: ${BAPPENAS_URL:-https://cloud.bappenas.go.id}
      BAPPENAS_USERNAME: ${BAPPENAS_USERNAME:-}
      BAPPENAS_PASSWORD: ${BAPPENAS_PASSWORD:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      SCAN_MAX_FILES: ${SCAN_MAX_FILES:-750}
      SCAN_DISCOVER_CONCURRENCY: ${SCAN_DISCOVER_CONCURRENCY:-12}
      SCAN_INGEST_CONCURRENCY: ${SCAN_INGEST_CONCURRENCY:-12}
      WEBDAV_DISCOVERY_CONCURRENCY: ${WEBDAV_DISCOVERY_CONCURRENCY:-24}
      WEBDAV_DOWNLOAD_CONCURRENCY: ${WEBDAV_DOWNLOAD_CONCURRENCY:-14}
      POST_SYNC_WARM_ENABLED: ${POST_SYNC_WARM_ENABLED:-true}
      POST_SYNC_WARM_MAX_DIRS: ${POST_SYNC_WARM_MAX_DIRS:-40}
      INGEST_MAX_RETRY_COUNT: ${INGEST_MAX_RETRY_COUNT:-5}
      SCAN_STUCK_JOB_MINUTES: ${SCAN_STUCK_JOB_MINUTES:-45}
      CLOUD_LIVE_SUMMARY_TTL_SEC: ${CLOUD_LIVE_SUMMARY_TTL_SEC:-1800}
      CLOUD_LIVE_SCAN_MAX_DIRS: ${CLOUD_LIVE_SCAN_MAX_DIRS:-2000}
      CLOUD_LISTING_CACHE_TTL_SEC: ${CLOUD_LISTING_CACHE_TTL_SEC:-600}
      ASK_FULL_DOC_MAX_CHARS: ${ASK_FULL_DOC_MAX_CHARS:-100000}
      ASK_RANK_CONTENT_CHARS: ${ASK_RANK_CONTENT_CHARS:-48000}
      OCR_PENDING_TIMEOUT_MINUTES: ${OCR_PENDING_TIMEOUT_MINUTES:-180}
      OCR_RECONCILE_INTERVAL_MS: ${OCR_RECONCILE_INTERVAL_MS:-5000}
      OCR_RECONCILE_BATCH: ${OCR_RECONCILE_BATCH:-300}
      EMBED_BACKFILL_BATCH: ${EMBED_BACKFILL_BATCH:-35}
      TZ: ${TZ:-Asia/Jakarta}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  paperless_data:
  paperless_media:
  sync_temp:
